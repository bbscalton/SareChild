name: Deploy Parent Web (Firebase Hosting)

# Requires a repo secret `FIREBASE_SERVICE_ACCOUNT_SAFECHILD_F34AC` containing
# the JSON key of a Firebase service account with Hosting Admin access on the
# `safechild-f34ac` project. Generate one in Firebase Console > Project
# Settings > Service Accounts, or via:
#   gcloud iam service-accounts keys create key.json \
#     --iam-account=firebase-adminsdk@safechild-f34ac.iam.gserviceaccount.com
# then add its contents as the secret (Settings > Secrets and variables >
# Actions) before this workflow can deploy. Until then, deploy manually with
# `firebase deploy --only hosting` from an authenticated machine.

on:
  push:
    branches: ["main"]
    paths:
      - "parent-web/**"
      - "firebase.json"
      - ".github/workflows/deploy-parent-web-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: parent-web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_R2_MEDIA_PROXY_BASE_URL: ${{ secrets.VITE_R2_MEDIA_PROXY_BASE_URL }}
          VITE_PLATFORM_HEALTH_URL: ${{ secrets.VITE_PLATFORM_HEALTH_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAFECHILD_F34AC }}
          projectId: safechild-f34ac
          channelId: live
          entryPoint: .
